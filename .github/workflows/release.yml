# v* 태그를 푸시하면 Windows 설치 파일을 빌드해 GitHub 릴리스에 올린다.
# 태그는 src/app_version.py 의 VERSION 과 같아야 한다 (VERSION = "0.0.3" → 태그 v0.0.3).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches app version
        shell: pwsh
        run: |
          $version = (Select-String src/app_version.py -Pattern 'VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} != v$version (src/app_version.py)" }

      - uses: astral-sh/setup-uv@v6

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem build/release/*.exe).FullName --title "${{ github.ref_name }}" --generate-notes
